<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Charmed Treat Card Picker</title>
  <style>
    body {font-family:Arial,sans-serif; text-align:center; margin:2rem;}
    #cards {display:flex; flex-wrap:wrap; justify-content:center; gap:1rem;}
    .card {width:120px; height:180px; border:2px solid #555; border-radius:8px;
           display:flex; align-items:center; justify-content:center;
           cursor:pointer; background:#eee; font-weight:bold;}
    .selected {border-color:#4c0994; background:#c798fa;}
    button {margin-top:2rem; padding:.5rem 1rem; font-size:1rem;}
  </style>
</head>
<body>
  <h1>Pick a Charmed Treat Card</h1>

  <div id="cards">
    <div class="card" data-id="$1off" style="background:#ffeb3b;">$1 OFF Specialty Oil</div>
    <div class="card" data-id="mysterygem" style="background:#c8e6c9;">Free Mystery Gem</div>
    <div class="card" data-id="magicalunicorn" style="background:#bbdefb;">Free Magical Unicorn Fortune Teller</div>
    <div class="card" data-id="innerpeace" style="background:#bbdefb;">Free Inner Peace AromaCharm</div>
    <div class="card" data-id="$1off" style="background:#ffeb3b;">$1 OFF Specialty Oil</div>
    <div class="card" data-id="$1off" style="background:#ffeb3b;">$1 off White Sage Smudge Stick</div>
    <div class="card" data-id="Manifestingquartz" style="background:#ffeb3b;">Free Manifesting Quartz Crystal</div>
  </div>

  <button id="download" disabled>Download Printable Card</button>

  <!-- jsPDF from CDN – no installation needed -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    // ----- SELECT A CARD ----------------------------------------------------
    const cardsDiv = document.getElementById('cards')
    let chosen = null

    cardsDiv.addEventListener('click', e => {
      const el = e.target.closest('.card')
      if (!el) return
      // deselect all
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'))
      // select clicked
      el.classList.add('selected')
      chosen = {id: el.dataset.id, label: el.textContent, bg: el.style.background}
      document.getElementById('download').disabled = false
    })

    // ----- CREATE PDF -------------------------------------------------------
    document.getElementById('download').addEventListener('click', () => {
      if (!chosen) return
      const {jsPDF} = window.jspdf
      // Credit‑card size (85.6 × 53.98 mm)
      const doc = new jsPDF({unit:'mm', format:[85.6,53.98]})

      // background colour
      doc.setFillColor(chosen.bg)
      doc.rect(0,0,85.6,53.98,'F')

      // centre the text
      doc.setTextColor('#000')
      doc.setFontSize(14)
      doc.text(chosen.label, 42.8, 30, {align:'center'})

      // optional: a short code for redemption
      const code = Math.random().toString(36).substr(2,6).toUpperCase()
      doc.setFontSize(10)
      doc.text('Code: '+code, 42.8, 45, {align:'center'})

      doc.save(chosen.id + '_card.pdf')
    })
  </script>
</body>
</html>
